[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secscan"
version = "1.0.0"
description = "Static security scanner that explains each finding's impact, exploitability, prevalence and recent real-world news"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["security", "sast", "static-analysis", "vulnerability", "cwe", "owasp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
# No runtime dependencies: standard library only.
dependencies = []

[project.optional-dependencies]
# certifi is only a convenience for systems with no usable root certificate
# store; secscan finds the OS bundle on its own where one exists.
certs = ["certifi"]

[project.scripts]
secscan = "secscan.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools]
packages = ["secscan"]
